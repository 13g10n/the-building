services:
  ntfy:
    image: binwiederhier/ntfy:v2.38.1
    container_name: ntfy
    restart: unless-stopped
    command: serve
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/Minsk}
      NTFY_BASE_URL: https://ntfy.13g10n.dev
      NTFY_LISTEN_HTTP: ":80"
      NTFY_BEHIND_PROXY: "true"
      # Jack's Caddy is the only proxy. Direct posts from PVE and PBS send no forwarded header.
      NTFY_PROXY_TRUSTED_HOSTS: 10.0.2.5
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_CACHE_DURATION: 24h
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ENABLE_LOGIN: "true"
      NTFY_ATTACHMENT_CACHE_DIR: /var/lib/ntfy/attachments
      # iPhone instant delivery. The relay receives a message id and a topic hash. The body stays here.
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
      NTFY_WEB_PUSH_FILE: /var/lib/ntfy/webpush.db
      NTFY_WEB_PUSH_EMAIL_ADDRESS: contact@13g10n.com
      NTFY_WEB_PUSH_PUBLIC_KEY: ${NTFY_WEB_PUSH_PUBLIC_KEY:?set NTFY_WEB_PUSH_PUBLIC_KEY in .env}
      NTFY_WEB_PUSH_PRIVATE_KEY: ${NTFY_WEB_PUSH_PRIVATE_KEY:?set NTFY_WEB_PUSH_PRIVATE_KEY in .env}
    ports:
      - "10.0.4.5:80:80"
    volumes:
      - ntfy-data:/var/lib/ntfy

volumes:
  ntfy-data:
