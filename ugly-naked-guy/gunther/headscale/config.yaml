# Headscale 0.29.4.
# Same-tag example: https://github.com/juanfont/headscale/blob/v0.29.4/config-example.yaml
#
# These four values are overridden from .env when the container starts:
#   HEADSCALE_SERVER_URL
#   HEADSCALE_TLS_LETSENCRYPT_HOSTNAME
#   HEADSCALE_ACME_EMAIL
#   HEADSCALE_DNS_BASE_DOMAIN
# The placeholders below must not survive startup. If the log still shows
# headscale.invalid, the override did not apply.

server_url: https://headscale.invalid

listen_addr: 0.0.0.0:443
metrics_listen_addr: 0.0.0.0:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

# Peer traffic is WireGuard. When a direct path fails, clients relay through
# Tailscale's public DERP servers. Embedded DERP is off, so UDP 3478 is not
# required. See the README to turn the local relay on.
derp:
  server:
    enabled: false
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  paths: []
  auto_update_enabled: true
  update_frequency: 3h

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true

acme_url: https://acme-v02.api.letsencrypt.org/directory
acme_email: ""
tls_letsencrypt_hostname: headscale.invalid
tls_letsencrypt_cache_dir: /var/lib/headscale/cache
tls_letsencrypt_challenge_type: TLS-ALPN-01
tls_cert_path: ""
tls_key_path: ""

log:
  level: info
  format: text

# Empty path is allow-all. Set path to a HuJSON file to restrict the tailnet.
policy:
  mode: file
  path: ""

dns:
  magic_dns: true
  base_domain: tailnet.invalid
  override_local_dns: true
  nameservers:
    global:
      - 1.1.1.1
      - 1.0.0.1
      - 2606:4700:4700::1111
      - 2606:4700:4700::1001
  search_domains: []

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

# Keep client logs off Tailscale's log service.
logtail:
  enabled: false

taildrop:
  enabled: true
