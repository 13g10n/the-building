model_list:
  - model_name: grok-4.5
    litellm_params:
      model: openai/grok-4.5
      api_base: http://cliproxyapi:8317/v1
      api_key: "not-needed"

  - model_name: grok-imagine
    litellm_params:
      model: openai/grok-imagine-image
      api_base: http://cliproxyapi:8317/v1
      api_key: "not-needed"
    model_info:
      mode: image_generation

  - model_name: grok-imagine-quality
    litellm_params:
      model: openai/grok-imagine-image-quality
      api_base: http://cliproxyapi:8317/v1
      api_key: "not-needed"
    model_info:
      mode: image_generation


general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY


litellm_settings:
  drop_params: true
  callbacks:
    - strip_image_url.strip_image_url
