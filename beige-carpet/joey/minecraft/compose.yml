services:
  mc:
    image: itzg/minecraft-server:latest
    pull_policy: daily
    tty: true
    stdin_open: true
    restart: always
    ports:
      - "25565:25565"
      - "8100:8100"
    healthcheck:
      test: mc-health
      start_period: 1m
      interval: 5s
      retries: 20
    environment:
      MEMORY: 4G
      TZ: "Europe/Minsk"
      EULA: TRUE
      TYPE: FABRIC
      VERSION: "26.3"
      ICON: /icon.svg
      OVERRIDE_ICON: true
      MOTD: "This is motd :)"
      MODE: survival
      DIFFICULTY: hard
      MAX_PLAYERS: 5
      SPAWN_PROTECTION: 32
      ENABLE_WHITELIST: TRUE
      WHITELIST: |
        13g10n
      OPS: |
        13g10n
      MODRINTH_PROJECTS: |
        fabric-api
        create-fly:beta
        bluemap
        lithium
        ferrite-core
    volumes:
      - ./data:/data
      - ./assets/icon.svg:/icon.svg
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
