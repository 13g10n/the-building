services:
  adguard:
    image: adguard/adguardhome:latest
    hostname: adguard
    ports:
      - 8080:80
      - 53:53/tcp
      - 53:53/udp
    restart: unless-stopped
    volumes:
      - ./data:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf

  adguardhome-sync:
    image: ghcr.io/bakito/adguardhome-sync:v0.9.6
    command: run --config /config/adguardhome-sync.yaml
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - adguard
    ports:
      # Status API on the CT loopback. AdGuard keeps host port 8080.
      - 127.0.0.1:8081:8080
    volumes:
      - ./adguardhome-sync.yaml:/config/adguardhome-sync.yaml:ro
    healthcheck:
      test: ["CMD", "/opt/go/adguardhome-sync", "healthcheck", "--config", "/config/adguardhome-sync.yaml"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
